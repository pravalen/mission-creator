<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Maasai Translator — MaasaiGPT</title>
<meta name="description" content="Translate between English and Maa." />
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png" />
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --ground: #C7EBD5;
    --ground-soft: #B4E1C5;
    --ink: #1A2620;
    --ink-soft: #55695D;
    --line: #A0CDAE;
    --accent: #33436B;
    --accent-soft: #8E9CBB;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
  }

  body {
    background: var(--ground);
    color: var(--ink);
    font-family: "Source Serif 4", "Iowan Old Style", "Times New Roman", Georgia, serif;
  }

  .page {
    max-width: 860px;
    margin: 0 auto;
    padding: clamp(1.5rem, 4vw, 3rem) clamp(1.25rem, 4vw, 2rem) 5rem;
  }

  .back {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    color: var(--ink-soft);
    text-decoration: none;
    font-size: 0.85rem;
    font-style: italic;
    transition: color 0.2s ease;
  }

  .back svg {
    width: 14px;
    height: 14px;
  }

  .back:hover,
  .back:focus-visible {
    color: var(--ink);
  }

  .hero {
    text-align: center;
    margin: clamp(2.5rem, 6vw, 4rem) 0 clamp(2.25rem, 5vw, 3.25rem);
  }

  .eyebrow {
    display: block;
    font-style: italic;
    font-size: clamp(0.9rem, 1.5vw, 1.05rem);
    color: var(--ink-soft);
  }

  h1 {
    font-weight: 600;
    font-size: clamp(2rem, 5vw, 2.7rem);
    margin: 0.2em 0 0;
    line-height: 1.1;
    text-wrap: balance;
  }

  .sub {
    margin: 0.9rem auto 0;
    max-width: 46ch;
    color: var(--ink-soft);
    font-size: clamp(0.92rem, 1.5vw, 1.02rem);
    line-height: 1.6;
  }

  .translator {
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: clamp(1.25rem, 3.5vw, 2rem);
    background: rgba(255, 255, 255, 0.32);
    box-shadow: 0 2px 24px rgba(26, 38, 32, 0.06);
  }

  .lang-row {
    display: flex;
    align-items: stretch;
    gap: clamp(0.75rem, 2vw, 1.25rem);
  }

  .lang-col {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }

  .lang-label {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  textarea {
    width: 100%;
    min-height: 180px;
    resize: vertical;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 0.85rem 1rem;
    font-family: inherit;
    font-size: 1rem;
    line-height: 1.5;
    color: var(--ink);
    background: var(--ground);
    outline: none;
    transition: border-color 0.2s ease;
  }

  textarea:focus {
    border-color: var(--accent-soft);
  }

  textarea::placeholder {
    color: #787D7A;
    font-style: italic;
  }

  .swap-btn {
    align-self: center;
    flex-shrink: 0;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--ground);
    color: var(--ink);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  }

  .swap-btn:hover,
  .swap-btn:focus-visible {
    background: #34473C;
    border-color: #34473C;
    color: #F2F7F3;
  }

  .swap-btn svg {
    width: 17px;
    height: 17px;
    transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .swap-btn.spin svg {
    transform: rotate(180deg);
  }

  .actions {
    display: flex;
    justify-content: center;
    margin-top: clamp(1.5rem, 3vw, 2rem);
  }

  .translate-btn {
    background: var(--accent);
    color: #F6F2E8;
    border: none;
    border-radius: 999px;
    padding: 0.75rem 1.9rem;
    font-family: inherit;
    font-size: 0.95rem;
    letter-spacing: 0.01em;
    cursor: pointer;
    transition: background-color 0.2s ease;
  }

  .translate-btn:hover,
  .translate-btn:focus-visible {
    background: #26314F;
  }

  .translate-btn:focus-visible {
    outline: 1px solid var(--accent-soft);
    outline-offset: 2px;
  }

  .note {
    margin-top: 1.1rem;
    text-align: center;
    font-size: 0.85rem;
    font-style: italic;
    color: var(--ink-soft);
    min-height: 1.3em;
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .note.show {
    opacity: 1;
  }

  @media (max-width: 640px) {
    .lang-row {
      flex-direction: column;
    }

    .swap-btn svg {
      transform: rotate(90deg);
    }

    .swap-btn.spin svg {
      transform: rotate(270deg);
    }
  }
</style>
</head>
<body>

<div class="page">
  <a class="back" href="index.html">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 18l-6-6 6-6" />
    </svg>
    Back to MaasaiGPT
  </a>

  <div class="hero">
    <span class="eyebrow">A MaasaiGPT tool</span>
    <h1>Maasai Translator</h1>
    <p class="sub">Translate between English and Maa, the language of the Maasai people.</p>
  </div>

  <div class="translator">
    <div class="lang-row">
      <div class="lang-col">
        <span class="lang-label" id="labelLeft">English</span>
        <textarea id="inputLeft" placeholder="Type in English..."></textarea>
      </div>

      <button class="swap-btn" id="swapBtn" type="button" aria-label="Swap languages">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 3L4 7l4 4" />
          <path d="M4 7h16" />
          <path d="M16 21l4-4-4-4" />
          <path d="M20 17H4" />
        </svg>
      </button>

      <div class="lang-col">
        <span class="lang-label" id="labelRight">Maa</span>
        <textarea id="inputRight" placeholder="Translation will appear here..."></textarea>
      </div>
    </div>

    <div class="actions">
      <button class="translate-btn" id="translateBtn" type="button">Translate</button>
    </div>
    <p class="note" id="note"></p>
  </div>
</div>

<script>
  var swapped = false;
  var labelLeft = document.getElementById('labelLeft');
  var labelRight = document.getElementById('labelRight');
  var inputLeft = document.getElementById('inputLeft');
  var inputRight = document.getElementById('inputRight');
  var swapBtn = document.getElementById('swapBtn');
  var note = document.getElementById('note');

  swapBtn.addEventListener('click', function () {
    swapped = !swapped;
    swapBtn.classList.toggle('spin');

    var leftText = swapped ? 'Maa' : 'English';
    var rightText = swapped ? 'English' : 'Maa';
    labelLeft.textContent = leftText;
    labelRight.textContent = rightText;
    inputLeft.placeholder = 'Type in ' + leftText + '...';
    inputRight.placeholder = 'Translation will appear here...';

    var tmp = inputLeft.value;
    inputLeft.value = inputRight.value;
    inputRight.value = tmp;

    note.classList.remove('show');
  });

  document.getElementById('translateBtn').addEventListener('click', function () {
    note.textContent = 'Live translation is coming soon — this is a preview of the interface.';
    note.classList.add('show');
  });
</script>
</body>
</html>
